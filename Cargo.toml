[package]
name = "yelogin"
description = "A simple login and authentication program."
version = "1.2.0"
edition = "2024"
homepage = "https://github.com/mustafaelrasheid/yelogin"
repository = "https://github.com/mustafaelrasheid/yelogin"
license = "MIT"
keywords = ["login", "yescrypt", "passwd", "shadow", "linux"]
categories = ["command-line-utilities", "authentication"]

[dependencies]
clap = { version = "4.6.0", features = [ "derive" ] }
nix = { version = "0.31.2", features = [ "user", "process" ] }
termios = "0.3.3"
yescrypt = "0.1.0-rc.5"
